name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files: $unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 ./...

      - name: test -race
        run: go test -race -count=1 ./...

      - name: shellcheck deploy scripts
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck deploy/install.sh deploy/build-deb.sh
          else
            bash -n deploy/install.sh && bash -n deploy/build-deb.sh
          fi
