# ChessGateway — TCP/UCI gateway, one engine process per client connection
# (max_clients up to 4096). Load with: sudo sysctl -p /etc/sysctl.d/99-chessgateway.conf

# Go uses net.core.somaxconn as the listener backlog. Keep it >= max_clients
# so a burst of simultaneous connects is not dropped by the kernel.
net.core.somaxconn = 8192

# Half-open SYN queue: headroom for connection bursts.
net.ipv4.tcp_max_syn_backlog = 8192

# Client reconnects leave TIME_WAIT sockets; 30 s instead of 60 s bounds
# how long dead sockets linger.
net.ipv4.tcp_fin_timeout = 30

# Keep SYN-cookie protection explicit (cheap defense if the gateway is ever
# exposed to a larger network).
net.ipv4.tcp_syncookies = 1

# Per-process file descriptor limits are a ulimit (systemd LimitNOFILE), not a
# sysctl. Rule of thumb: about 4 fds per client (socket + engine stdin/stdout/
# stderr). System-wide ceiling, tune to the machine's RAM:
# fs.file-max = 262144
# fs.nr_open = 1048576

# The gateway opens no outbound TCP connections (engines are local processes
# on pipes): tcp_tw_reuse and ip_local_port_range are intentionally absent.
